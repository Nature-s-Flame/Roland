<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roland · Nature's Flame CRM</title>
<style>
@font-face{font-family:"Open Sans";src:url(fonts/OpenSans-Regular.ttf) format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Open Sans";src:url(fonts/OpenSans-Italic.ttf) format("truetype");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Open Sans";src:url(fonts/OpenSans-SemiBold.ttf) format("truetype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Open Sans";src:url(fonts/OpenSans-Bold.ttf) format("truetype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Open Sans Condensed";src:url(fonts/OpenSans_Condensed-Light.ttf) format("truetype");font-weight:300;font-display:swap}
@font-face{font-family:"Open Sans Condensed";src:url(fonts/OpenSans_Condensed-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Open Sans Condensed";src:url(fonts/OpenSans_Condensed-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"Open Sans Condensed";src:url(fonts/OpenSans_Condensed-Bold.ttf) format("truetype");font-weight:700;font-display:swap}

/* Nature's Flame brand tokens (Style Guide, Nov 2022) */
:root{
  --heading:#1D332F; --chip:#ECEFE6; --wordmark:#66783C; color-scheme:light;
  --nf-green:#82A519;      /* 377C primary */
  --nf-olive:#66783C;      /* 575C primary */
  --nf-sage:#CDDCB9;       /* 7485C secondary */
  --nf-sand:#CDC896;       /* 5875C secondary */
  --nf-forest:#1D332F;     /* 5467C secondary */

  --bg:#F5F7F0;
  --surface:#FFFFFF;
  --surface-2:#FAFBF6;
  --line:#DDE3D2;
  --line-soft:#ECEFE4;
  --ink:#1D2A26;
  --ink-2:#47534C;
  --ink-3:#5E6A62;
  --link:#55662F;
  --link-hover:#3E4C20;
  --cta:#66783C;
  --cta-hover:#55662F;
  --cta-ink:#FFFFFF;
  --accent:#82A519;
  --sage-soft:#E6EEDA;
  --sand-soft:#EFEDD9;
  --sand-ink:#5B5524;
  --alert-bg:#F6E3D8;
  --alert-ink:#8A3A16;
  --info-bg:#DDE7E4;
  --info-ink:#1D332F;
  --shadow:0 10px 28px rgba(29,51,47,.18);
  --cond:"Open Sans Condensed","Open Sans",system-ui,sans-serif;
  --sans:"Open Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --heading:#DCE8CC; --wordmark:#A9C55A; --chip:#2A3A34;
  --bg:#121D1A; --surface:#1A2925; --surface-2:#1F302B; --line:#30443D; --line-soft:#26372F;
  --ink:#E6ECE2; --ink-2:#B9C5B8; --ink-3:#97A598; --link:#A9C55A; --link-hover:#C3DB7A;
  --sage-soft:#24372C; --sand-soft:#3A3724; --sand-ink:#E2DCA8;
  --alert-bg:#4A2A1C; --alert-ink:#F2B9A0; --info-bg:#233A36; --info-ink:#CFE3DD;
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --heading:#DCE8CC; --wordmark:#A9C55A; --chip:#2A3A34;
  --bg:#121D1A; --surface:#1A2925; --surface-2:#1F302B; --line:#30443D; --line-soft:#26372F;
  --ink:#E6ECE2; --ink-2:#B9C5B8; --ink-3:#97A598; --link:#A9C55A; --link-hover:#C3DB7A;
  --sage-soft:#24372C; --sand-soft:#3A3724; --sand-ink:#E2DCA8;
  --alert-bg:#4A2A1C; --alert-ink:#F2B9A0; --info-bg:#233A36; --info-ink:#CFE3DD;
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--link)}a:hover{color:var(--link-hover)}
h1,h2,h3{font-family:var(--cond);color:var(--heading);margin:0}
h1{font-weight:600;font-size:32px;letter-spacing:.2px}
h2{font-weight:600;font-size:21px;letter-spacing:.2px}
.eyebrow{font-family:var(--cond);font-weight:400;text-transform:uppercase;letter-spacing:1.4px;font-size:13px;color:var(--ink-3)}
.sub{margin:4px 0 0;font-size:15px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink-3)}
:focus-visible{outline:3px solid var(--nf-green);outline-offset:2px}

/* Shell */
.app{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--nf-forest);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:10px 24px;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand .name{font-family:var(--cond);font-weight:600;font-size:26px;letter-spacing:.4px;line-height:1}
.brand .by{font-family:var(--cond);font-weight:300;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--nf-sage);margin-top:3px}
.search{flex:1 1 260px;max-width:460px}
.search input{width:100%;height:40px;border-radius:6px;border:1px solid rgba(205,220,185,.35);background:rgba(255,255,255,.08);color:#fff;padding:0 14px;font:inherit;font-size:14.5px}
.search input::placeholder{color:#B9C8B6}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.btn{height:40px;padding:0 16px;border:0;border-radius:6px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-cta{background:var(--nf-green);color:var(--nf-forest)}
.btn-cta:hover{background:#93B827}
.btn-olive{background:var(--cta);color:var(--cta-ink)}
.btn-olive:hover{background:var(--cta-hover)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--nf-sage);color:var(--nf-forest);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

.body{display:flex;flex-wrap:wrap;flex:1 1 auto;align-items:stretch}
.side{flex:1 1 240px;max-width:290px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.side-group{display:flex;flex-direction:column;gap:3px}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;font-size:14.5px;color:var(--ink);cursor:pointer;min-height:40px;border-left:3px solid transparent}
.nav:hover{background:var(--sage-soft)}
.nav.on{background:var(--nf-forest);color:#fff;border-left-color:var(--nf-green)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill-soon{background:var(--sand-soft);color:var(--sand-ink)}
.pill-src{background:var(--info-bg);color:var(--info-ink)}
.nav.on .pill{background:rgba(255,255,255,.16);color:#fff}
.portal-link{display:block;padding:11px 12px;border-radius:6px;background:var(--nf-olive);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.portal-link:hover{background:var(--cta-hover);color:#fff}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-3)}

main{flex:999 1 560px;min-width:0;padding:28px 32px 96px;display:flex;flex-direction:column;gap:24px}
@media (max-width:640px){main{padding:20px 16px 96px}.top{padding:10px 16px}}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--nf-forest);color:#fff;border-radius:12px;padding:26px 28px;min-height:132px}
.hero h1{color:#fff;font-size:34px}
.hero p{margin:6px 0 0;color:var(--nf-sage);font-size:16px;max-width:60ch;position:relative;z-index:1}
.hero .swoosh{position:absolute;right:-10px;bottom:-6px;height:150px;width:auto;pointer-events:none}

/* Cards & grids */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.g-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h2{font-size:19px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--nf-green);border-radius:10px;padding:14px 18px}
.kpi .v{font-family:var(--cond);font-weight:700;font-size:30px;color:var(--heading);margin-top:2px;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .n{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kpi.src{border-top-color:var(--nf-olive)}

.feat{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 13px;cursor:pointer;margin:0}
.feat:hover{border-color:var(--nf-olive);box-shadow:0 0 0 1px var(--nf-olive) inset}
.feat .t{font-weight:700;font-size:14.5px}
.feat .d{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.stage-card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.stage-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage-card .hd span:first-child{font-family:var(--cond);font-weight:600;font-size:17px;color:var(--heading)}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.tag-mvp{background:var(--nf-sage);color:var(--nf-forest)}
.tag-plan{background:var(--sand-soft);color:var(--sand-ink)}

.row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:flex-start}
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14.5px}
.kv span:last-child{font-weight:600;text-align:right}
.badge{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap}
.b-over,.b-stall{background:var(--alert-bg);color:var(--alert-ink)}
.b-today{background:var(--nf-sage);color:var(--nf-forest)}
.b-later,.b-done{background:var(--chip);color:var(--ink-2)}
.st-Customer{background:var(--nf-sage);color:var(--nf-forest)}
.st-Prospect{background:var(--sand-soft);color:var(--sand-ink)}
.st-Lead{background:var(--chip);color:var(--ink-2)}
.st-Lost{background:var(--alert-bg);color:var(--alert-ink)}
.st-Lapsed{background:var(--sand-soft);color:var(--sand-ink)}
.b-soon{background:var(--sand-soft);color:var(--sand-ink)}
.b-review{background:var(--info-bg);color:var(--info-ink)}
.review-box{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--nf-olive)}
.review-box.overdue{border-left-color:var(--alert-ink)}
.rv-in{display:block;width:100%;margin-top:4px;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:default}
.doc-link{font-weight:600;font-size:13.5px;white-space:nowrap}

/* Prospects */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--ink-2);font-weight:600}
.req{color:var(--alert-ink)}
.in{height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--ink);width:100%}
select.in{padding-right:4px}
.in:focus,textarea:focus{border-color:var(--nf-olive)}
textarea{background:var(--surface);color:var(--ink)}
.err-card{border-left:4px solid var(--alert-ink);background:var(--alert-bg);color:var(--alert-ink)}
.warn-card{border-left:4px solid var(--nf-sand);background:var(--sand-soft);color:var(--sand-ink)}
.info-card{border-left:4px solid var(--nf-olive)}
.dup{color:var(--sand-ink);background:var(--sand-soft);padding:4px 8px;border-radius:5px;display:block;margin-top:2px}
.value-box{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--sage-soft)}
.value-box .vv{font-family:var(--cond);font-weight:700;font-size:26px;color:var(--heading)}
.lead-card{border-left:4px solid var(--nf-green)}
.st-Cold{background:var(--info-bg);color:var(--info-ink)}
.btn-quiet{background:var(--surface);color:var(--heading);border:1px solid var(--line)}
.btn-quiet:hover{border-color:var(--nf-olive)}
.step-btn{border:0;cursor:pointer;font:inherit;font-size:13px}
.step-btn:hover{outline:2px solid var(--nf-olive)}
.sel{user-select:all}

/* Quotes: form beside a paper preview. The paper stays white in both themes, like the PDF. */
:root{--paper:#FFFFFF;--paper-ink:#1D2A26;--paper-muted:#5E6A62;--paper-line:#DDE3D2;--paper-tint:#ECF2E4}
.q-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.q-split{grid-template-columns:minmax(0,1fr)}}
.q-preview{position:sticky;top:12px;min-width:0}
.q-preview-wide{position:static;max-width:820px}
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;font-size:12.5px;line-height:1.5}
.paper-head{background:var(--nf-forest);color:#fff;display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:4px solid var(--nf-green)}
.paper-head .pw{font-weight:700;font-size:15px;line-height:1.05}
.ph-r{margin-left:auto;text-align:right;font-size:11.5px;color:var(--nf-sage)}
.ph-t{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:1px;text-transform:uppercase;color:#fff}
.paper-body{padding:18px 22px 10px;display:flex;flex-direction:column;gap:8px}
.paper-body p{margin:0}
.pp-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.pp-2{grid-template-columns:1fr}}
.pp-l{font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--nf-olive);margin-top:6px}
.pp-b{font-weight:700;font-size:14px}
.pp-t{width:100%;border-collapse:collapse}
.pp-t th{text-align:left;font-weight:400;color:var(--paper-muted);width:34%;padding:5px 0;border-top:1px solid var(--paper-line);vertical-align:top}
.pp-t td{font-weight:600;padding:5px 0;border-top:1px solid var(--paper-line)}
.pp-m{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;text-align:center;font-weight:600;font-size:11px}
.pp-m span{display:block;font-weight:400;color:var(--paper-muted)}
.pp-price{background:var(--paper-tint);border-left:4px solid var(--nf-olive);padding:10px 14px;margin-top:4px}
.pp-big{font-family:var(--cond);font-weight:700;font-size:26px;color:var(--nf-forest)}
.pp-big span{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--paper-muted)}
.pp-terms{margin:0;padding-left:18px;font-size:11.5px}
.pp-terms li{margin-bottom:4px}
.pp-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.pp-sign div{border-top:1px solid var(--paper-ink);padding-top:3px;font-size:11px;color:var(--paper-muted)}
.paper .tiny{color:var(--paper-muted)}
.paper-foot{border-top:3px solid var(--nf-green);margin:8px 22px 0;padding:8px 0 14px;font-size:10.5px;color:var(--paper-muted)}
.pp-sig{font-family:"Homemade Apple","Segoe Script","Brush Script MT",cursive;font-size:24px;color:#1E2F5C;margin:6px 0 0;line-height:1.4}
.pp-sig.pending{font-family:var(--sans);font-size:12px;color:var(--paper-muted);font-style:italic;padding:10px 0}
.pp-sigline{border-top:1px solid var(--paper-ink);max-width:260px;padding-top:3px;font-size:11px;color:var(--paper-muted)}
.paper-draft{position:absolute;top:96px;right:-38px;transform:rotate(35deg);background:var(--sand-soft);color:var(--sand-ink);font-family:var(--cond);font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:3px 48px;font-size:13px;opacity:.9}
.avatar{overflow:hidden;flex:none}
.who{font-size:14px;color:var(--nf-sage);white-space:nowrap}
@media (max-width:640px){.who{display:none}}
.source-bar{background:var(--sage-soft);color:var(--ink);font-size:13px;padding:7px 24px;border-bottom:1px solid var(--line)}
.source-bar strong{color:var(--heading)}
.k-in{background:var(--info-bg);color:var(--info-ink)}
.k-out{background:var(--chip);color:var(--ink-2)}
.k-teams{background:var(--sand-soft);color:var(--sand-ink)}

.lnk{border:0;background:none;padding:0;color:var(--link);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--link-hover)}
.back{border:0;background:none;color:var(--link);cursor:pointer;padding:6px 0;font-weight:600;font-size:14px;align-self:flex-start}
.back:hover{color:var(--link-hover)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-family:var(--cond);font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);font-size:13px;padding:11px 14px;border-bottom:2px solid var(--nf-sage);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Pipeline */
.board{overflow-x:auto;padding-bottom:8px}
.board-in{display:flex;gap:12px;min-width:min-content}
.col{flex:0 0 220px;background:var(--sage-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--nf-olive)}
.col.won{border-top-color:var(--nf-green)}
.col .h{font-family:var(--cond);font-weight:600;font-size:16px;color:var(--heading)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1 1 0;min-width:96px;padding:9px 10px;font-size:13px;background:var(--chip);color:var(--ink-2);border-radius:5px;text-align:center}
.step.done{background:var(--nf-sage);color:var(--nf-forest)}
.step.cur{background:var(--nf-forest);color:#fff;font-weight:700}

/* Bars */
.spark{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:6px;border-bottom:1px solid var(--line)}
.spark div{flex:1 1 0;background:var(--nf-olive);border-radius:3px 3px 0 0}
.spark div:hover{background:var(--nf-green)}
.spark-l{display:flex;gap:4px;margin-top:4px}
.spark-l span{flex:1 1 0;text-align:center;font-size:10.5px;color:var(--ink-3)}
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.hbar .track{background:var(--sage-soft);border-radius:4px;height:14px}
.hbar .fill{height:14px;border-radius:4px;background:var(--nf-olive)}
.hbar span:last-child{text-align:right;font-weight:600}

.draft{background:var(--surface-2);border:1px dashed var(--nf-olive);border-radius:8px;padding:12px 14px;margin-top:6px}
.draft .h{font-family:var(--cond);font-size:12.5px;font-weight:600;color:var(--nf-olive);letter-spacing:.8px;text-transform:uppercase}
textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--nf-olive)}
.plan-ex{background:var(--nf-forest);color:#fff;border-radius:10px;padding:18px 20px;position:relative;overflow:hidden}
.plan-ex .eyebrow{color:var(--nf-green)}

/* Chat */
.launch{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--nf-forest);color:#fff;font-weight:700;font-size:15px;padding:0 20px;height:52px;cursor:pointer;box-shadow:var(--shadow)}
.launch:hover{background:#28463F}
.chat{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:410px;max-width:calc(100vw - 32px);height:620px;max-height:calc(100vh - 40px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:640px){.chat{right:16px;bottom:16px}}
.chat-h{background:var(--nf-forest);color:#fff;padding:12px 10px 12px 16px;display:flex;align-items:center;gap:10px}
.chat-h .t{font-family:var(--cond);font-weight:600;font-size:19px;line-height:1}
.chat-h .s{font-size:12px;color:var(--nf-sage)}
.iconbtn{border:0;background:transparent;color:#fff;font-size:20px;min-width:40px;height:40px;border-radius:6px;cursor:pointer;padding:0 8px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.chat-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.msg-u{align-self:flex-end;max-width:85%;background:var(--nf-forest);color:#fff;border-radius:12px 12px 4px 12px;padding:10px 14px;font-size:14.5px}
.msg-r{align-self:flex-start;max-width:92%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--nf-green);border-radius:12px 12px 12px 4px;padding:11px 14px;font-size:14.5px;white-space:pre-line}
.msg-r .src{margin-top:8px;padding-top:7px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-3);white-space:normal}
.msg-r .src-line{display:block;margin-top:8px;padding-top:7px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-3)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--heading);font-size:13.5px;font-weight:600;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:38px;text-align:left}
.chip:hover{border-color:var(--nf-olive);background:var(--sage-soft)}
.chat-f{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;background:var(--surface)}
.chat-f input{flex:1;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:15px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

  // ---------- Contracts (Key Contracts Register) ----------

  var CONTRACTS = [];

    } else {

    else if (info.next && !nextDone && days(TODAY, info.next) <= REVIEW_LEAD_DAYS) { info.state = 'due'; info.cycle = info.next; }

    else if (d <= 180) { info.state = 'later'; info.label = 'Expires ' + longDate(c.end); }

  function leadState(l) {

  function initReviewStore() {
    if (REVIEW_STORE) return;
    try { REVIEWS = JSON.parse(localStorage.getItem('roland.reviews') || '{}') || {}; } catch (e) { REVIEWS = {}; }
    REVIEW_STORE = { mode: 'local', save: function (id, doc) {

      try { localStorage.setItem('roland.reviews', JSON.stringify(REVIEWS)); } catch (e) { return Promise.reject(e); }
      return Promise.resolve();
    } };
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) return;
      REVIEW_STORE = { mode: 'shared', save: function (id, doc) { return db.collection('reviews').doc(id).set(doc); } };
      if (user) user.id().then(function (id) { ME = id; render(); });
      db.collection('reviews').onSnapshot(function (snap) {
        var m = {};

        REVIEWS = m;
        var ids = Object.keys(m).map(function (k) { return m[k].by; }).filter(function (id) { return id && !(id in PEOPLE); });

      else if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'not_declared' || e.code === 'capability_disabled' || e.code === 'capability_removed')) {
        st.aiOff = true; live.error = true; live.text = 'Claude is not available to Roland for your account, so I’ll use the built-in sample answers instead.';
      } else { live.text = (e && e.text ? e.text + '\n\n' : '') + aiError(e && e.code); live.error = !e || !e.text; }
      set({ thinking: false, aiStatus: '' });
    });
  }
  function fmtAi(t) {
    return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/^- /gm, '• ').replace(/^(Sources?:.*)$/m, '<span class="src-line">$1</span>');
  }
  function ask(text) {
    var q = (text || '').trim();
    if (!q || st.thinking) return;
    if (aiLive()) return askAI(q);
    set({ chatOpen: true, thinking: true, msgs: st.msgs.concat([{ role: 'user', text: q }]) });
    setTimeout(function () {
      var a = answerFor(q);
      set({ thinking: false, msgs: st.msgs.concat([{ role: 'roland', text: a.text, src: a.src }]) });
    }, 800);
  }
  var SUGG_REAL = ['Which customers have the biggest overdue balances?', 'What contracts need attention this month?', 'Brief me on Open Country Dairy', 'How much loose bulk pellet stock can we promise?'];
  function vChat() {
    if (!st.chatOpen) return '<button class="launch" data-chat="open">' + MARK.replace('width="28" height="38"', 'width="16" height="22"') + 'Ask Roland</button>';
    var live = aiLive(), sugg = live ? SUGG_REAL : SUGG;
    var body = '';
    if (!st.msgs.length && !st.thinking) {
      body = '<div class="msg-r" style="border-left-color:var(--nf-olive)">' + (live
        ? 'Kia ora' + (VIEWER.first ? ' ' + esc(VIEWER.first) : '') + ', I’m Roland. Ask me about customers, sales, payments, contracts, prospects, quotes, stock or prices, and I’ll look it up in Roland’s data.'
        : 'Kia ora, I’m Roland. Ask me about a customer, a deal, stock, orders or your emails, and I’ll pull it together from the CRM, SAP and Outlook.') + '</div>' +
        '<div class="eyebrow">Try asking</div>' + sugg.map(function (q, i) { return '<button class="chip" data-sugg="' + i + '">' + esc(q) + '</button>'; }).join('');
    } else {
      body = st.msgs.map(function (m) {
        if (m.role === 'user') return '<div class="msg-u">' + esc(m.text) + '</div>';
        if (m.live) return '<div class="msg-r"><div id="ai-live">' + (m.text ? fmtAi(m.text) : '') + '</div>' + (!m.text ? '<div class="muted small" id="ai-status">' + esc(st.aiStatus || 'Thinking…') + '</div>' : '') + '</div>';
        return '<div class="msg-r' + (m.error ? ' muted' : '') + '">' + (m.src ? esc(m.text) + '<div class="src">' + esc(m.src) + '</div>' : fmtAi(m.text)) + (m.truncated ? '<div class="tiny">Cut short. Ask for less at a time.</div>' : '') + '</div>';
      }).join('') + (st.thinking && !live ? '<div class="msg-r muted">Roland is checking the CRM, SAP and Outlook…</div>' : '');
    }
    var sub = live ? 'Answers from Claude on your account · Roland’s data' : 'Your sales assistant · sample answers';
    var foot = live ? 'Roland looks things up in this page’s data and may still make mistakes; check figures before you rely on them. It cannot send or change anything.'
      : (AI && !REAL ? 'Live answers need the real data loaded.' : 'Sample answers. Live answers from Claude work when this page is opened in claude.ai.');
    return '<section class="chat" aria-label="Ask Roland"><div class="chat-h">' + MARK + '<div style="flex:1"><div class="t">Roland</div><div class="s">' + esc(sub) + '</div></div>' +
      '<button class="iconbtn" style="font-size:14px" data-chat="reset">New chat</button><button class="iconbtn" aria-label="Close Ask Roland" data-chat="close">×</button></div>' +
      '<div class="chat-b" id="chatb">' + body + '</div>' +
      '<form class="chat-f" id="chatf"><label class="sr" for="chatq">Ask Roland a question</label><input id="chatq" type="text" placeholder="Ask Roland anything…" autocomplete="off">' +
      (st.thinking && live ? '<button type="button" class="btn btn-quiet" style="height:44px" data-chat="stop">Stop</button>' : '<button class="btn btn-olive" style="height:44px">Ask</button>') + '</form>' +
      '<div class="tiny" style="padding:0 14px 10px;background:var(--surface)">' + esc(foot) + '</div></section>';
  }

  // ---------- Shell ----------
  function render() {
    var cur = currentKey();
    var side = tree().map(function (g) {
      return '<div class="side-group"><div class="side-head"><span class="eyebrow" style="font-size:12.5px">' + esc(g.name) + '</span><span class="tiny">' + esc(g.tag) + '</span></div>' +
        g.items.map(function (it) {
          var key = it.mode === 'planned' ? 'plan-' + it.id : it.id;
          return '<button class="nav' + (cur === key ? ' on' : '') + '" ' + navAttrs(it) + '><span>' + esc(it.label) + '</span>' +
            (it.mode === 'planned' ? '<span class="pill pill-soon">soon</span>' : '') + (it.mode === 'preview' ? '<span class="pill pill-src">' + esc(it.badge) + '</span>' : '') + '</button>';
        }).join('') + '</div>';
    }).join('');
    var hadFocusInChat = document.activeElement && document.activeElement.id === 'chatq';
    // keep focus and caret in whichever field the person is typing in across re-renders
    var ae = document.activeElement, focusId = ae && ae.id && ae.id !== 'chatq' ? ae.id : null, caret = null;
    try { if (focusId && typeof ae.selectionStart === 'number') caret = [ae.selectionStart, ae.selectionEnd]; } catch (err) { caret = null; }
    var source = REAL
      ? '<div class="source-bar"><strong>Real data</strong> · ' + esc(REAL.meta.source) + ' · invoices to ' + esc(longDate(REAL.meta.asOf)) + ' · pipeline from the sales plan · activities, comms and chat are samples · contains customer data: share only within Nature’s Flame</div>'
      : '';
    document.getElementById('app').innerHTML =
      '<header class="top"><a class="brand" href="#" data-go="home">' + MARK + '<div><div class="name">Roland</div><div class="by">Nature’s Flame CRM</div></div></a>' +
      '<div class="search"><input type="search" aria-label="Search accounts, deals and contacts" placeholder="Search accounts, deals, contacts"></div>' +
      '<div class="top-right"><button class="btn btn-cta" data-go="prospectNew">+ New prospect</button>' + avatarHtml() + '</div></header>' + source +
      '<div class="body"><nav class="side" aria-label="Feature tree">' + side +
      '<div style="padding:0 10px"><div class="eyebrow" style="font-size:12.5px;padding-bottom:8px">Stage 4 · Customer portal</div><a class="portal-link" href="portal.html">See what a customer sees →</a></div>' +
      '<div class="side-foot">' + (REAL ? 'Customers, sales, stock, prices and the pipeline are real SAP and sales-plan data. Activities, comms and the portal are samples.' : 'Mock-up for discussion. All names, prices and figures are fictitious.') + '</div></nav>' +
      '<main id="main">' + (VIEWS[st.view] || vHome)() + '</main></div>' + vChat();
    var cb = document.getElementById('chatb'); if (cb) cb.scrollTop = cb.scrollHeight;
    if (hadFocusInChat || (st.chatOpen && !st.thinking && st.msgs.length)) { var q = document.getElementById('chatq'); if (q) q.focus(); }
    if (focusId) {
      var fe = document.getElementById(focusId);
      if (fe && fe !== document.activeElement) { fe.focus(); try { if (caret) fe.setSelectionRange(caret[0], caret[1]); } catch (err) { /* not a text field */ } }
    }
  }

  // ---------- Events ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-plan],[data-deal],[data-acc],[data-draft],[data-chat],[data-sugg],[data-seg],[data-con],[data-ctype],[data-rv-open],[data-rv-save],[data-rv-cancel],[data-lead],[data-lstage],[data-lact],[data-pfilter],[data-quote],[data-qact],[data-qfilter],[data-qnew-lead],[data-qnew-acc]');
    if (!el) return;
    var ds = el.dataset;
    if (ds.lead) { set({ view: 'prospect', leadId: ds.lead, lPanel: null, crmError: '', copyMsg: '', copyFallback: false, af: null, sf: null }); window.scrollTo(0, 0); return; }
    if (ds.lstage) { var cur = LEADS[st.leadId]; if (cur) updateLead(st.leadId, { stage: ds.lstage, stageAt: new Date().toISOString() }, 'Stage: ' + (cur.stage || 'Enquiry') + ' → ' + ds.lstage); return; }
    if (ds.lact) { crmAction(ds.lact); return; }
    if (ds.pfilter) { set({ pFilter: ds.pfilter }); return; }
    if (ds.quote) { set({ view: 'quote', quoteId: ds.quote, qPanel: null, qMsg: '', crmError: '', emailFallback: false }); window.scrollTo(0, 0); return; }
    if (ds.qact) { quoteAction(ds.qact, el); return; }
    if (ds.qfilter) { set({ qFilter: ds.qfilter }); return; }
    if (ds.qnewLead) { st.qf = quoteFromLead(ds.qnewLead); st.qEditId = null; st.qfErrors = []; set({ view: 'quoteEdit', crmError: '' }); window.scrollTo(0, 0); return; }
    if (ds.qnewAcc) { st.qf = quoteFromAccount(ds.qnewAcc); st.qEditId = null; st.qfErrors = []; set({ view: 'quoteEdit', crmError: '' }); window.scrollTo(0, 0); return; }
    if (ds.go === 'quoteTerms') { st.qt = null; st.qMsg = ''; }
    if (ds.go === 'quote' && !QUOTES[st.quoteId]) ds = { go: 'quotes' };
    if (ds.go === 'prospectNew' && st.view !== 'prospectNew') { st.pf = blankProspect(); st.pfEditId = null; st.pfErrors = []; st.crmError = ''; }
    if (ds.go === 'prospect' && !LEADS[st.leadId]) ds = { go: 'prospects' };
    if ('seg' in ds) set({ accSeg: ds.seg });
    else if ('ctype' in ds) set({ conType: ds.ctype });
    else if (ds.con) { set({ view: 'contract', conKey: ds.con, rvOpen: null, rvError: '' }); window.scrollTo(0, 0); }
    else if (ds.rvOpen) { set({ rvOpen: ds.rvOpen, rvRate: '', rvNote: '', rvError: '', view: 'contract', conKey: ds.rvOpen.split('|')[0] }); var ri = document.getElementById('rv-rate'); if (ri) ri.focus(); }
    else if (ds.rvSave) { var p = ds.rvSave.split('|'); saveReview(p[0], p[1]); }
    else if (ds.rvCancel) set({ rvOpen: null, rvError: '' });
    else if (ds.go) { e.preventDefault(); set({ view: ds.go }); window.scrollTo(0, 0); }
    else if (ds.plan) { set({ view: 'planned', planId: ds.plan }); window.scrollTo(0, 0); }
    else if (ds.deal) { set({ view: 'deal', dealId: ds.deal }); window.scrollTo(0, 0); }
    else if (ds.acc) { set({ view: 'account', accId: ds.acc }); window.scrollTo(0, 0); }
    else if (ds.draft) { var m = Object.assign({}, st.drafts); m[ds.draft] = !m[ds.draft]; set({ drafts: m }); }
    else if (ds.chat === 'open') set({ chatOpen: true });
    else if (ds.chat === 'close') set({ chatOpen: false });
    else if (ds.chat === 'reset') { if (AI_CTL && st.thinking) AI_CTL.abort(); set({ msgs: [], thinking: false }); }
    else if (ds.chat === 'stop') { if (AI_CTL) AI_CTL.abort(); }
    else if (ds.sugg) ask((aiLive() ? SUGG_REAL : SUGG)[+ds.sugg]);
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'con-action') { set({ conAction: e.target.checked }); return; }
    var id = e.target.dataset && e.target.dataset.act;
    if (id) { var m = Object.assign({}, st.done); m[id] = e.target.checked; set({ done: m }); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'chatf') return;
    e.preventDefault();
    ask(document.getElementById('chatq').value);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'accq') set({ accQ: e.target.value });
    else if (e.target.id === 'rv-rate') st.rvRate = e.target.value;
    else if (e.target.id === 'rv-note') st.rvNote = e.target.value;
    else if (e.target.id === 'pq') set({ pq: e.target.value });
    else if (e.target.dataset) {
      var d = e.target.dataset, v = e.target.value;
      if (d.pf) { (st.pf = st.pf || blankProspect())[d.pf] = v; if (['company', 'volume', 'price', 'term'].indexOf(d.pf) >= 0) render(); }
      else if (d.pf === undefined && d.af) (st.af = st.af || {})[d.af] = v;
      else if (d.lf === 'coldReason') { if (LEADS[st.leadId]) updateLead(st.leadId, { coldReason: v }, v ? 'Cold reason: ' + v : 'Cold reason cleared'); }
      else if (d.lf) (st.lf = st.lf || {})[d.lf] = v;
      else if (d.sf) (st.sf = st.sf || {})[d.sf] = v;
      else if (d.qf) { (st.qf = st.qf || blankQuote())[d.qf] = v; render(); }
      else if (d.mp) (st.mp = st.mp || {})[d.mp] = v;
      else if (d.qs) (st.qsf = st.qsf || {})[d.qs] = v;
      else if (d.qd) (st.qdf = st.qdf || {})[d.qd] = v;
      else if (d.ap) (st.apf = st.apf || {})[d.ap] = v;
      else if (d.qt) { var pr = d.qt.split(':'); if (st.qt && st.qt[+pr[0]]) st.qt[+pr[0]][pr[1]] = v; }
    }
  });
  document.addEventListener('change', function (e) {
    // selects: pre-fill the expected price when a product is chosen
    var d = e.target.dataset || {};
    if (d.pf === 'product') {
      var p = productOptions().filter(function (o) { return o.label === e.target.value; })[0];
      st.pf.product = e.target.value;
      if (p && p.price && !num(st.pf.price)) st.pf.price = String(Math.round(p.price));
      render();
    }
  });

  derive();
  initViewer();
  initCrm();
  initQuotes();
  initAI();
  // Real data: embedded by `build_artifact.py --with-data`, or read from the local
  // (git-ignored) data/ folder. Without either, the page stays on sample data.
  if (window.ROLAND_SNAPSHOT && window.ROLAND_SNAPSHOT.accounts) applySnapshot(window.ROLAND_SNAPSHOT);
  render();
  if (!REAL) {
    fetch('../data/snapshot.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) { if (s && s.accounts) { applySnapshot(s); render(); } })
      .catch(function () { /* no snapshot: stay on sample data */ });
  }
})();
</script>
</body>
</html>
